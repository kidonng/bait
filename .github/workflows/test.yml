name: Test

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'e2e/**'
      - 'internal/**'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'e2e/**'
      - 'internal/**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Run unit tests
        run: mise run test

      - name: Run e2e tests
        run: mise run e2e
